<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fieldnote</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #f7f8fa; color: #101828;
        font: 14px/1.6 "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) { body { background: #0c111d; color: #e7ebf3; } }
      .wrap { text-align: center; max-width: 34rem; padding: 2rem; }
      .mark {
        width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 1.1rem;
        background: linear-gradient(140deg, #1d4ed8, #7c3aed);
        display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 19px;
      }
      h1 { margin: 0 0 .35rem; font-size: 1.35rem; letter-spacing: -.02em; }
      p { margin: 0; opacity: .68; }
      .bar { width: 200px; height: 4px; border-radius: 999px; margin: 1.5rem auto 0;
             background: rgba(127,127,127,.22); overflow: hidden; }
      .bar span { display: block; width: 40%; height: 100%; border-radius: 999px;
                  background: #1d4ed8; animation: slide 1.15s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      .error { display: none; text-align: left; margin-top: 1.5rem; padding: .9rem 1rem;
               border-radius: 8px; background: rgba(180,35,24,.1); color: #b42318; }
      .error pre { white-space: pre-wrap; font-size: 11px; max-height: 12rem; overflow: auto; margin: .5rem 0 0; }
      body.failed .bar, body.failed .loading { display: none; }
      body.failed .error { display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">FN</div>
      <h1>Fieldnote</h1>
      <p class="loading">Starting the local workspace…</p>
      <div class="bar"><span></span></div>
      <div class="error">
        <strong>Fieldnote could not start.</strong>
        <pre id="detail"></pre>
      </div>
    </div>
    <script>
      // The shell emits one of these once the backend has settled. Nothing here
      // talks to the product; the window is replaced entirely on success.
      const listen = window.__TAURI__?.event?.listen;
      if (listen) {
        listen('fieldnote://failed', (event) => {
          document.body.classList.add('failed');
          document.getElementById('detail').textContent = String(event.payload ?? 'Unknown error');
        });
      }
    </script>
  </body>
</html>
